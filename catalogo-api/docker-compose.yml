services:
  db:
    image: postgres:16-alpine
    container_name: catalogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalogo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_cambiar
    ports:
      - "5432:5432"
    volumes:
      - catalogo_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  catalogo_data:
